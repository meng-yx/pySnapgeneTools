[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pysnapgene-writer"
version = "0.1.0"
description = "Minimalist Python package to write SnapGene .dna files, preserving features, colours and properties"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Yuxuan Meng" }]
keywords = ["snapgene", "dna", "plasmid", "bioinformatics", "biopython", "molecular-biology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["biopython>=1.79"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4"]
notebook = ["jupyter", "notebook"]

[project.urls]
Homepage = "https://github.com/meng-yx/pysnapgene-writer"
Issues = "https://github.com/meng-yx/pysnapgene-writer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pysnapgene_writer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B905"]

[tool.coverage.run]
source = ["pysnapgene_writer"]
