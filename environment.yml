# Development environment for pysnapgene-writer.
#   conda env create -f environment.yml
#   conda activate pysnapgene-writer
#   pip install -e .
name: pysnapgene-writer
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - biopython>=1.79
  - pytest>=7
  - pytest-cov>=4
  - ruff>=0.4
  - jupyter
  - notebook
  - pip
  - pip:
      - -e .
